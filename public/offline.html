<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>MotoLog — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: calc(env(safe-area-inset-top) + 1.5rem) 1.5rem
          calc(env(safe-area-inset-bottom) + 1.5rem);
        background: #09090b;
        color: #ededed;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border-radius: 999px;
        background: #f59e0b;
        color: #09090b;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.25rem 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        min-height: 44px;
        border: 0;
        border-radius: 0.5rem;
        background: #fafafa;
        color: #09090b;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0 1.25rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <span class="badge">Offline</span>
    <h1>Tidak ada koneksi internet</h1>
    <p>
      MotoLog menampilkan data terakhir yang tersimpan. Halaman yang sudah pernah
      dibuka tetap bisa diakses.
    </p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </body>
</html>
